<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="{{ASSET_PREFIX}}style.css">
<script>
  (function () {
    var stored = localStorage.getItem("theme");
    var theme = stored || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

<div class="page">

  <header class="site-header">
    <a href="{{ASSET_PREFIX}}index.html" class="brand">radnyx</a>
    <div class="header-icons">
      <a href="https://github.com/radnyxx" title="github">github</a>
      <a href="https://x.com/_radnyx_" title="x / twitter">x</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="toggle theme">☣︎</button>
    </div>
  </header>

  <nav class="topnav">
    <a href="{{ASSET_PREFIX}}index.html">home</a>
    <a href="{{ASSET_PREFIX}}blog.html">blog</a>
    <a href="{{ASSET_PREFIX}}projects.html">projects</a>
    <a href="{{ASSET_PREFIX}}notes.html">notes</a>
    <a href="{{ASSET_PREFIX}}journal.html">journal</a>
    <a href="{{ASSET_PREFIX}}art.html">art</a>
  </nav>

{{BODY}}

  <footer class="site-footer">
    <span>CC BY-NC-SA 4.0 · 2026 © radnyx // rajasi</span>
    <span>built with <a href="https://pages.github.com">github pages</a></span>
  </footer>

</div>

<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    var root = document.documentElement;

    function paint() {
      var dark = root.getAttribute("data-theme") === "dark";
      btn.textContent = dark ? "⏾" : "○";
    }

    paint();

    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      paint();
    });
  })();
</script>
</body>
</html>
